<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0508">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tigrinho">
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="data:,">
<title>Tigrinho Dourado · Entrar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   INDEX.HTML — TELA DE LOGIN
   ------------------------------------------------------------
   Responsabilidades:
   1. Autenticar (local, sem backend) ou criar conta.
   2. Criar/garantir as variáveis persistentes:
      - cassino_users_v1    (array de usuários)
      - cassino_session_v1  (id do usuário logado)
      - cassino_history_v1  (histórico — opcional aqui, mas garantido)
   3. Redirecionar para home.html após sucesso.
   ------------------------------------------------------------
   AVISO DE SEGURANÇA (honesto):
   Não há backend. Senha é campo de UI, armazenada em texto puro
   no localStorage. Isso é aceitável para protótipo local, mas
   NÃO é seguro contra inspeção do storage. Não use em produção
   com dinheiro real.
   ============================================================ */

:root {
  --gold: #ffd700;
  --gold-3: #b8860b;
  --gold-5: #ffe066;
  --red: #d4261a;
  --red-dark: #8b0000;
  --bg: #0a0508;
  --bg-2: #14080c;
  --bg-3: #2a0a12;
  --cream: #fdf6e3;
  --text: #ffffff;
  --text-2: #d0c8b8;
  --text-3: #8a8070;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-title: 'Cinzel', serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse at top, rgba(212, 38, 26, 0.20) 0%, transparent 55%),
    radial-gradient(ellipse at bottom, rgba(255, 215, 0, 0.12) 0%, transparent 55%),
    linear-gradient(180deg, #050205 0%, #0a0508 50%, #14080c 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ---------- Marca ---------- */
.brand {
  text-align: center;
  margin-bottom: 22px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 100px;
  background: linear-gradient(135deg, rgba(255,215,0,0.18) 0%, rgba(212,38,26,0.18) 100%);
  border: 1px solid rgba(255,215,0,0.5);
  font-family: var(--font-title);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  box-shadow: 0 0 24px rgba(255,215,0,0.25);
  animation: badgePulse 2s ease-in-out infinite;
}
.brand-badge i { font-size: 12px; }
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.25); }
  50%     { box-shadow: 0 0 36px rgba(255,215,0,0.55); }
}
.brand-title {
  font-family: var(--font-title);
  font-size: clamp(28px, 9vw, 44px);
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: linear-gradient(180deg, #fff5cc 0%, #ffd700 45%, #b8860b 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 12px rgba(255,215,0,0.5));
  margin-top: 12px;
  line-height: 1.05;
}
.brand-sub {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: rgba(255,215,0,0.7);
  text-transform: uppercase;
  font-weight: 800;
  margin-top: 10px;
}

/* ---------- Card de login ---------- */
.auth-card {
  width: 100%;
  max-width: 420px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,215,0,0.08) 0%, transparent 60%),
    linear-gradient(180deg, #1a0a12 0%, #0a0508 100%);
  border: 1.5px solid rgba(255,215,0,0.35);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(255,215,0,0.08);
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,215,0,0.6), transparent 40%, transparent 60%, rgba(255,215,0,0.3));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

/* ---------- Abas ---------- */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 4px;
  background: rgba(0,0,0,0.35);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,215,0,0.15);
}
.tab {
  padding: 10px 8px;
  border: none;
  background: transparent;
  color: rgba(255,215,0,0.55);
  font-family: var(--font-title);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-radius: 9px;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
}
.tab.active {
  color: #1a0a05;
  background: linear-gradient(180deg, #ffe066 0%, #ffd700 45%, #b8860b 100%);
  box-shadow: 0 4px 14px rgba(255,215,0,0.4);
}

/* ---------- Form ---------- */
.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.2em;
  color: rgba(255,215,0,0.75);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.field-input {
  position: relative;
}
.field-input i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,215,0,0.55);
  font-size: 14px;
  pointer-events: none;
}
.field input {
  width: 100%;
  padding: 14px 14px 14px 42px;
  background: rgba(0,0,0,0.45);
  border: 1.5px solid rgba(255,215,0,0.25);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input::placeholder { color: rgba(208,200,184,0.35); font-weight: 500; }
.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255,215,0,0.18);
}
.field input:invalid:not(:placeholder-shown) {
  border-color: rgba(212,38,26,0.7);
}

/* ---------- Botão principal ---------- */
.btn-primary {
  width: 100%;
  padding: 16px;
  margin-top: 6px;
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  background: linear-gradient(180deg, #ffe066 0%, #ffd700 35%, #b8860b 100%);
  color: #1a0a05;
  box-shadow: 0 6px 0 #6b4f0a, 0 12px 32px rgba(255,215,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
}
.btn-primary:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #6b4f0a, 0 6px 20px rgba(255,215,0,0.35);
}
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.4); }
.btn-primary i { font-size: 15px; }

/* ---------- Mensagens ---------- */
.msg {
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.msg.show { display: flex; }
.msg.error { background: rgba(212,38,26,0.15); border: 1px solid rgba(212,38,26,0.5); color: #ff8a80; }
.msg.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.5); color: #86efac; }

/* ---------- Rodapé ---------- */
.foot {
  margin-top: 22px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(208,200,184,0.4);
  text-transform: uppercase;
  font-weight: 700;
}
.foot strong { color: rgba(255,215,0,0.7); }

/* ---------- Convite / visitante ---------- */
.guest-link {
  display: block;
  margin-top: 16px;
  text-align: center;
  background: none;
  border: none;
  color: rgba(255,215,0,0.65);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(255,215,0,0.3);
}
.guest-link:active { color: var(--gold); }

/* ---------- Splash (enquanto valida sessão) ---------- */
.splash {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #0a0508;
  z-index: 9999;
}
.splash i {
  font-size: 42px;
  color: var(--gold);
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.7));
}
.splash span {
  font-family: var(--font-title);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: rgba(255,215,0,0.7);
  text-transform: uppercase;
  font-weight: 800;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Splash inicial: evita flash do form enquanto validamos sessão existente -->
<div class="splash" id="splash">
  <i class="fa-solid fa-crown fa-beat"></i>
  <span>Verificando sessão…</span>
</div>

<header class="brand">
  <div class="brand-badge">
    <i class="fa-solid fa-crown"></i>
    <span>Acesso</span>
  </div>
  <h1 class="brand-title">Tigrinho<br>Dourado</h1>
  <p class="brand-sub">Entre para jogar</p>
</header>

<main class="auth-card" id="authCard" hidden>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabLogin" role="tab" aria-selected="true">Entrar</button>
    <button class="tab" id="tabRegister" role="tab" aria-selected="false">Criar conta</button>
  </div>

  <form id="authForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="username">Usuário</label>
      <div class="field-input">
        <i class="fa-solid fa-user"></i>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="mín. 3 caracteres"
          minlength="3"
          maxlength="20"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required>
      </div>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <div class="field-input">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="mín. 4 caracteres"
          minlength="4"
          maxlength="40"
          required>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      <i class="fa-solid fa-right-to-bracket"></i>
      <span id="submitLabel">Entrar</span>
    </button>

    <div class="msg" id="msg" role="alert"></div>
  </form>

  <button type="button" class="guest-link" id="guestBtn">
    <i class="fa-solid fa-ghost"></i> Jogar como convidado
  </button>

</main>

<p class="foot">
  <strong>Projeto local</strong> · sem dinheiro real · sem backend
</p>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONSTANTES DE STORAGE
     ------------------------------------------------------------
     Estas chaves SÃO O CONTRATO com os outros arquivos:
       - laistiger.html / script.js leem cassino_session_v1 e cassino_users_v1
       - home.html idem
       - regatebonus.html / bonuswin.html leem cassino_users_v1
     NÃO RENOMEIE sem atualizar todos os arquivos.
     ============================================================ */
  const STORAGE_USERS   = "cassino_users_v1";
  const STORAGE_SESSION = "cassino_session_v1";
  const STORAGE_HISTORY = "cassino_history_v1";

  const START_COINS = 1000;           // centavos → L$ 10,00 inicial
  const HOME_URL    = "home.html";

  /* ============================================================
     STORAGE HELPERS
     ============================================================ */
  function getUsers() {
    try { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || []; }
    catch (e) { return []; }
  }
  function saveUsers(users) {
    try { localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }
    catch (e) { /* storage cheio / privado — ignoramos */ }
  }
  function getSession() {
    try { return localStorage.getItem(STORAGE_SESSION); }
    catch (e) { return null; }
  }
  function setSession(id) {
    try { localStorage.setItem(STORAGE_SESSION, id); }
    catch (e) {}
  }
  function ensureHistory() {
    try {
      if (!localStorage.getItem(STORAGE_HISTORY)) {
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify([]));
      }
    } catch (e) {}
  }

  /* ============================================================
     HELPERS DE UI
     ============================================================ */
  const $ = (id) => document.getElementById(id);

  function showMsg(text, type = "error") {
    const el = $("msg");
    if (!el) return;
    el.className = "msg show " + type;
    el.innerHTML = (type === "error"
      ? '<i class="fa-solid fa-circle-exclamation"></i>'
      : '<i class="fa-solid fa-circle-check"></i>') + "<span>" + text + "</span>";
  }
  function hideMsg() {
    const el = $("msg");
    if (el) el.className = "msg";
  }

  /* ============================================================
     CRIAÇÃO DE USUÁRIO
     ------------------------------------------------------------
     Estrutura persistida:
     {
       id, username, password, guest,
       coins, stats, eventProgress, createdAt
     }
     ============================================================ */
  function makeId(prefix) {
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function createUser(username, password, guest = false) {
    return {
      id: makeId(guest ? "guest" : "user"),
      username: username,
      password: password,          // AVISO: texto puro — protótipo local
      guest: guest,
      coins: START_COINS,
      stats: {
        totalSpins: 0, totalHits: 0, totalWagered: 0, totalWon: 0,
        bigWins: 0, megaWins: 0, superWins: 0,
        totalEvents: 0, totalSurprises: 0, biggestWin: 0,
      },
      eventProgress: 0,
      lastBonusClaim: 0,           // timestamp — usado pela tela de bônus
      createdAt: Date.now(),
    };
  }

  function persistUser(user) {
    const users = getUsers();
    users.push(user);
    saveUsers(users);
    setSession(user.id);
    ensureHistory();
  }

  /* ============================================================
     REDIRECIONAMENTO
     ------------------------------------------------------------
     Sempre para home.html, usando replace pra não voltar pro login.
     ============================================================ */
  function goHome() {
    try { window.location.replace(HOME_URL); }
    catch (e) { window.location.href = HOME_URL; }
  }

  /* ============================================================
     VALIDAÇÃO
     ============================================================ */
  function validate(username, password) {
    if (!username || username.length < 3)  return "Usuário precisa ter ao menos 3 caracteres.";
    if (!password || password.length < 4)  return "Senha precisa ter ao menos 4 caracteres.";
    if (username.length > 20)              return "Usuário muito longo (máx. 20).";
    if (!/^[a-zA-Z0-9_.-]+$/.test(username)) return "Usuário só pode ter letras, números, _ . -";
    return null;
  }

  /* ============================================================
     AÇÕES
     ============================================================ */
  let mode = "login";  // "login" | "register"

  function switchMode(newMode) {
    mode = newMode;
    hideMsg();
    const tabLogin = $("tabLogin");
    const tabRegister = $("tabRegister");
    const label = $("submitLabel");
    const icon = $("submitBtn") && $("submitBtn").querySelector("i");

    if (newMode === "login") {
      tabLogin.classList.add("active");    tabLogin.setAttribute("aria-selected", "true");
      tabRegister.classList.remove("active"); tabRegister.setAttribute("aria-selected", "false");
      if (label) label.textContent = "Entrar";
      if (icon) icon.className = "fa-solid fa-right-to-bracket";
    } else {
      tabRegister.classList.add("active"); tabRegister.setAttribute("aria-selected", "true");
      tabLogin.classList.remove("active"); tabLogin.setAttribute("aria-selected", "false");
      if (label) label.textContent = "Criar conta";
      if (icon) icon.className = "fa-solid fa-user-plus";
    }
  }

  function handleSubmit(e) {
    e.preventDefault();
    hideMsg();

    const username = ($("username").value || "").trim();
    const password = ($("password").value || "");

    const err = validate(username, password);
    if (err) { showMsg(err, "error"); return; }

    const users = getUsers();
    const existing = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if (mode === "register") {
      if (existing) {
        showMsg("Este usuário já existe. Tente entrar.", "error");
        return;
      }
      const user = createUser(username, password, false);
      persistUser(user);
      showMsg("Conta criada! Entrando…", "success");
      setTimeout(goHome, 600);
      return;
    }

    // login
    if (!existing) {
      showMsg("Usuário não encontrado. Crie uma conta.", "error");
      return;
    }
    if (existing.guest) {
      showMsg("Esse usuário é convidado. Crie uma conta pra salvar progresso.", "error");
      return;
    }
    if (existing.password !== password) {
      showMsg("Senha incorreta.", "error");
      return;
    }
    setSession(existing.id);
    ensureHistory();
    showMsg("Bem-vindo de volta!", "success");
    setTimeout(goHome, 500);
  }

  function handleGuest() {
    hideMsg();
    const user = createUser("Convidado", "", true);
    persistUser(user);
    showMsg("Entrando como convidado…", "success");
    setTimeout(goHome, 500);
  }

  /* ============================================================
     BOOT
     ------------------------------------------------------------
     1. Se já existe sessão válida → pula direto pra home.
     2. Senão → mostra o form.
     ============================================================ */
  function boot() {
    const splash = $("splash");
    const card = $("authCard");

    // Valida sessão existente
    let hasSession = false;
    try {
      const sid = getSession();
      if (sid) {
        const users = getUsers();
        hasSession = users.some(u => u.id === sid);
      }
    } catch (e) { hasSession = false; }

    if (hasSession) {
      // Já logado — vai direto pra home
      goHome();
      return;
    }

    // Sem sessão — mostra form
    if (splash) splash.setAttribute("hidden", "");
    if (card) card.removeAttribute("hidden");

    // Listeners
    const tabLogin = $("tabLogin");
    const tabRegister = $("tabRegister");
    const form = $("authForm");
    const guestBtn = $("guestBtn");

    if (tabLogin)    tabLogin.addEventListener("click", () => switchMode("login"));
    if (tabRegister) tabRegister.addEventListener("click", () => switchMode("register"));
    if (form)        form.addEventListener("submit", handleSubmit);
    if (guestBtn)    guestBtn.addEventListener("click", handleGuest);

    // Foca no usuário em mobile? Não — evita teclado abrindo sozinho.
    console.log("%c🔐 index.html · login", "color:#ffd700;font-size:14px;font-weight:900;");
    console.log("Storage:", STORAGE_USERS, "|", STORAGE_SESSION, "|", STORAGE_HISTORY);
    console.log("Destino pós-login:", HOME_URL);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

</body>
</html>
